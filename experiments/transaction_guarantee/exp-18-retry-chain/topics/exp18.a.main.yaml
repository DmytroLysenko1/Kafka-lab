meta:
  name: exp18.a.main
  cluster: kafka-lab
  region: local
  environment: lab
  description: |
    exp-18, cell A, no retry chain: contention is treated like any other failure, so the
    consumer holds the offset and restarts.
    Six partitions like payments.main, so the contended payments are spread over the
    partitions the way a hot merchant's payments are.
spec:
  partitions: 6
  replicationFactor: 3
  retentionMinutes: 60
  placement:
    strategy: any
  settings:
    min.insync.replicas: 2
    unclean.leader.election.enable: false

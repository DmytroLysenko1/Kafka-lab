meta:
  name: exp18.c.dlq
  cluster: kafka-lab
  region: local
  environment: lab
  description: |
    exp-18, cell C, the retry chain, with the merchant locked past every tier: the payments
    are archived as exhausted and replayed once the lock is gone.
    The dead letter topic of this cell's chain.
spec:
  partitions: 6
  replicationFactor: 3
  retentionMinutes: 1440
  placement:
    strategy: any
  settings:
    min.insync.replicas: 2
    unclean.leader.election.enable: false

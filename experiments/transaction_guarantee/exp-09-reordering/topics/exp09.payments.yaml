meta:
  name: exp09.payments
  cluster: kafka-lab
  region: local
  environment: lab
  description: |
    exp-09, reordering: a steady stream of captures and refunds while a follower is frozen
    and thawed. min.insync.replicas 3 on three brokers: while the frozen follower is still
    in the in-sync set, acks=all requests are appended and then time out (REQUEST_TIMED_OUT);
    once it is dropped, they are refused before the append (NOT_ENOUGH_REPLICAS). Both are
    retriable, which is what makes the producer retry. One partition, so every request goes
    to the same leader and the order is a single sequence to check.

spec:
  partitions: 1
  replicationFactor: 3
  retentionMinutes: 60
  placement:
    strategy: any
  settings:
    min.insync.replicas: 3
    unclean.leader.election.enable: false

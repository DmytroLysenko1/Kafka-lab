name: kafka-lab

x-broker: &broker
  # Every image below is pinned by digest, like the Kubernetes stand's: a tag moves when it
  # is rebuilt, and an experiment rerun on a moved image is not the experiment that was run.
  image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
  # No restart policy on purpose: exp-04/exp-13 kill a broker and expect it to stay dead
  # until the experiment brings it back. `restart: unless-stopped` would resurrect it.
  restart: "no"
  # The probe starts a JVM (~1.1 s), so it runs often only while the broker is coming up:
  # at a 5 s steady-state interval three of them cost ~0.7 of a core and show up in the
  # p99 numbers exp-13/exp-17 are supposed to measure.
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
    interval: 30s
    start_interval: 2s
    timeout: 10s
    retries: 5
    start_period: 60s
  # The image's default heap (1g) plus ~300M off-heap, with headroom for the experiments'
  # load; the Kubernetes stand runs a 512m heap in 800Mi, measured. Two cores keep one busy
  # broker from starving the other two on a laptop during exp-17's throughput sweep.
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 1500M

x-broker-env: &broker-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
  # Internal topics default to 50 partitions each. On three brokers that is ~450 replicas
  # whose under-replicated count would bury the six partitions of payments.main on the
  # KR4 dashboard the moment a broker dies. Only settable before the topics are created.
  KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 3
  KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_NUM_PARTITIONS: 3
  # Pinned because their defaults decide experiment outcomes instead of Kafka doing it:
  # auto leader rebalance fires on a 300 s timer and would move leadership in the middle
  # of a recovery measurement (exp-04/exp-13) — preferred election is invoked explicitly
  # instead; the retention check also runs every 300 s, which makes exp-03 look broken.
  KAFKA_AUTO_LEADER_REBALANCE_ENABLE: "false"
  KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 5000
  # The cleaner's idle wait, 15 s by default: with it exp-03's compaction shows in seconds.
  KAFKA_LOG_CLEANER_BACKOFF_MS: 5000
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  # The controller fences a broker whose heartbeats stop after this long, which is what
  # removes a dead broker from every ISR. Overridable because exp-04c raises it and checks
  # that the reaction time moves with it — the experiment that turns exp-04's explanation
  # from an argument into a measurement.
  KAFKA_BROKER_SESSION_TIMEOUT_MS: ${KAFKA_BROKER_SESSION_TIMEOUT_MS:-9000}
  # A topic created by hand in an experiment without explicit values would otherwise get
  # RF 1 and a quorum of one. With eligible leader replicas the controller copies this
  # min.insync.replicas into its cluster-wide default when the cluster is first formatted.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  # 3 s by default: the coordinator waits that long for more members before the first
  # rebalance of a new group. The experiments time rebalances (exp-14) and start groups
  # hundreds of times; 3 s of wait in each measurement would be Kafka's pause, not the
  # strategy's. In production keep the default — it saves a rebalance per member at startup.
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: /var/lib/kafka/data

# The payments services as containers, behind the `app` profile: `make up` still starts only
# the stand, and the experiments keep running the services from a terminal, where they can
# be killed and restarted at will. The profile is the other way to run the same code, and
# the two are meant to be used one at a time: both bind the same loopback ports.
x-app: &app
  restart: "no"
  profiles: [app]
  depends_on:
    migrate:
      condition: service_completed_successfully
  # The memory limit of the Kubernetes chart, where it is measured (~24Mi peak); no CPU limit,
  # as there.
  deploy:
    resources:
      limits:
        memory: 64M

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_LAB_USER:-lab}:${POSTGRES_LAB_PASSWORD:-lab}@postgres:5432/${POSTGRES_LAB_DB:-lab}?sslmode=disable
  KAFKA_BROKERS: kafka1:9092,kafka2:9092,kafka3:9092
  # Every service exports its spans to Tempo; without the variable they still propagate the
  # trace they are handed, and export nothing (pkg/telemetry).
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318

services:
  migrate:
    profiles: [app]
    image: kafka-lab/migrate:${IMAGE_TAG:-dev}
    build: { context: .., dockerfile: deploy/docker/Dockerfile, args: { SERVICE: migrate } }
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    environment:
      <<: *app-env

  payments-api:
    <<: *app
    image: kafka-lab/payments-api:${IMAGE_TAG:-dev}
    build: { context: .., dockerfile: deploy/docker/Dockerfile, args: { SERVICE: payments-api } }
    container_name: kafka-lab-payments-api
    # Published on loopback under the same ports the host-run services use, so prometheus
    # scrapes host.docker.internal:910x either way and its config does not fork per mode.
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:9103:9103"
    environment:
      <<: *app-env
      # Empty when unset, and the API refuses to start on an empty key — make app-up says so first.
      PAYMENTS_API_KEY: ${PAYMENTS_API_KEY:-}
      PAYMENTS_API_ADDR: 0.0.0.0:8081
      METRICS_ADDR: 0.0.0.0:9103

  outbox-relay:
    <<: *app
    image: kafka-lab/outbox-relay:${IMAGE_TAG:-dev}
    build: { context: .., dockerfile: deploy/docker/Dockerfile, args: { SERVICE: outbox-relay } }
    container_name: kafka-lab-outbox-relay
    depends_on:
      migrate:
        condition: service_completed_successfully
      apicurio:
        condition: service_healthy
    ports:
      - "127.0.0.1:9101:9101"
    environment:
      <<: *app-env
      SCHEMA_REGISTRY_URL: http://apicurio:8080/apis/ccompat/v7
      METRICS_ADDR: 0.0.0.0:9101

  payments-consumer:
    <<: *app
    image: kafka-lab/payments-consumer:${IMAGE_TAG:-dev}
    build: { context: .., dockerfile: deploy/docker/Dockerfile, args: { SERVICE: payments-consumer } }
    container_name: kafka-lab-payments-consumer
    ports:
      - "127.0.0.1:9102:9102"
    environment:
      <<: *app-env
      METRICS_ADDR: 0.0.0.0:9102

  kafka1:
    <<: *broker
    hostname: kafka1
    container_name: kafka-lab-kafka1
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:19092
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    <<: *broker
    hostname: kafka2
    container_name: kafka-lab-kafka2
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://localhost:29092
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka3:
    <<: *broker
    hostname: kafka3
    container_name: kafka-lab-kafka3
    ports:
      - "127.0.0.1:39092:39092"
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:39092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://localhost:39092
    volumes:
      - kafka3-data:/var/lib/kafka/data

  # Credentials are lab constants, and the port is bound to loopback: nothing here is a
  # secret. Experiments own their own tables and create them on start.
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    hostname: postgres
    container_name: kafka-lab-postgres
    restart: "no"
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_LAB_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_LAB_PASSWORD:-lab}
      POSTGRES_DB: ${POSTGRES_LAB_DB:-lab}
    volumes:
      # Postgres 18 wants the mount one level up, at /var/lib/postgresql: the image refuses
      # to start on a volume mounted at .../data, which is where 17 and earlier put it.
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # Generous on purpose, on the stand that runs experiments: room for the ones that load
    # Postgres hardest (exp-18's contended rows, the integration tests' parallel pools); the
    # Kubernetes stand's instance, sized from measurement, peaked at 195Mi under the drills.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1500M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      start_interval: 2s
      timeout: 5s
      retries: 5
      start_period: 30s

  # The schema registry the payments service publishes against. Apicurio speaks Confluent's
  # wire protocol under /apis/ccompat/v7, which is the format the producer writes: magic
  # byte, schema id, message indexes, payload. Its storage is a database of its own inside
  # the lab Postgres, so a registered schema survives a restart — exp-12 needs the history.
  apicurio:
    image: apicurio/apicurio-registry:3.0.9@sha256:51bd0274264269c5431ee14f9882abce308affe53a8f3846eba3d93226d5e125
    hostname: apicurio
    container_name: kafka-lab-apicurio
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: postgresql
      APICURIO_DATASOURCE_URL: jdbc:postgresql://postgres:5432/apicurio
      APICURIO_DATASOURCE_USERNAME: ${POSTGRES_LAB_USER:-lab}
      APICURIO_DATASOURCE_PASSWORD: ${POSTGRES_LAB_PASSWORD:-lab}
      # The image's pool grows to 100 connections — Postgres's whole max_connections — and
      # `make test-integration`, which opens pools of its own beside it, met "too many clients"
      # on 28.09. Fixed at 20, as on the Kubernetes stand (deploy/k8s/platform/apicurio.yaml).
      APICURIO_DATASOURCE_JDBC_MAX_SIZE: "20"
      # The registry's web UI calls its own API from the browser; the port is bound to
      # loopback, so "*" opens it to pages on this machine only.
      QUARKUS_HTTP_CORS_ORIGINS: "*"
    # A JVM with its default heap share; the Kubernetes stand runs it in 512Mi (heap 50%) and
    # measured 206–228Mi over the drills, so this is generous by design on the stand that runs
    # experiments.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1000M
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/apis/registry/v3/system/info >/dev/null"]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 5
      # Quarkus is up in 5–9 s once its database is; the rest covers a cold Postgres and the
      # registry's first schema migration.
      start_period: 90s

  # Reads the cluster rather than the services: a consumer that has stopped cannot report
  # its own lag, and that is exactly when the number is worth having.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0@sha256:4150e46b2e9697ac30e4be8de03ec1704b4bdc7037577b83b8d35a32be298c16
    hostname: kafka-exporter
    container_name: kafka-lab-kafka-exporter
    restart: "no"
    command:
      - --kafka.server=kafka1:9092
      - --kafka.server=kafka2:9092
      - --kafka.server=kafka3:9092
      # The protocol version the exporter's client assumes (default 2.0.0). Checked by hand on
      # 27.09.2026 against the 4.3.1 brokers: 2.0.0, 4.0.0 and 4.3.1 all connect and report
      # brokers and consumer-group lag, so the value is not load-bearing; 4.0.0 names the
      # release line the brokers belong to.
      - --kafka.version=4.0.0
    depends_on:
      kafka1:
        condition: service_healthy
    ports:
      - "127.0.0.1:9308:9308"

  # A 5 s scrape interval is set in the config, not here: these experiments measure the
  # seconds after a broker dies, and the default 15 s would draw a recovery as a straight
  # line between two samples.
  prometheus:
    image: prom/prometheus:v3.6.0@sha256:76947e7ef22f8a698fc638f706685909be425dbe09bd7a2cd7aca849f79b5f64
    hostname: prometheus
    container_name: kafka-lab-prometheus
    restart: "no"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Six hours on a named volume: an experiment's graphs are read right after it runs, and
      # its numbers are written to the experiment's own log, not kept here. (The Kubernetes
      # stand keeps 24 h, because its resource figures are read back from Prometheus.)
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      # The three services run on the host so that an experiment can kill and restart them.
      - "host.docker.internal:host-gateway"

  # Traces: one payment from the HTTP request through its outbox row, the topic and the
  # consumer to the statement that counted it. Local disk, six hours (tempo.yaml). 4318 is
  # published for the services run on the host; 3200 is Grafana's way in and the API's.
  tempo:
    image: grafana/tempo:2.10.8@sha256:f0561deb1c68ec44d6e6e7e4487f30106c4e5e768642077695b37958b105812a
    hostname: tempo
    container_name: kafka-lab-tempo
    restart: "no"
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:3200:3200"
    deploy:
      resources:
        limits:
          memory: 512M

  # Anonymous, no sign-in: a dashboard on loopback that asks for a password is a dashboard
  # nobody opens during the incident it was built for. Editor, the least role Explore needs.
  grafana:
    # 12.2 here, 13.2 in the kube-prometheus-stack chart: the same dashboard file loads in both.
    image: grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    hostname: grafana
    container_name: kafka-lab-grafana
    restart: "no"
    depends_on:
      - prometheus
      - tempo
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  postgres-data:
  prometheus-data:
  grafana-data:
  tempo-data:

meta:
  name: exp02.uniform
  cluster: kafka-lab
  environment: lab
  region: local
  description: >-
    exp-02, the control cell: the same six partitions and the same events as
    exp02.hotkey, spread over a thousand merchants with none sending more than any
    other, so the only difference between the cells is the skew.

spec:
  partitions: 6
  replicationFactor: 3
  placement:
    strategy: any
  settings:
    min.insync.replicas: 2

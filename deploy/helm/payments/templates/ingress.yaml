{{- range $name, $component := .Values.components }}
{{- with $component.ingress }}
{{- $scope := dict "root" $ "name" $name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "payments.labels" $scope | nindent 4 }}
spec:
  ingressClassName: {{ .className }}
  rules:
    - host: {{ .host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
{{- end }}

meta:
  name: exp18.b.retry.12s
  cluster: kafka-lab
  region: local
  environment: lab
  description: |
    exp-18, cell B, the retry chain, with the merchant locked for a while and then released.
    Retry tier of 12s: the catalog's 5s/1m/10m scaled down so a run takes minutes,
    not eleven. LogAppendTime, as in the catalog: the delay counts from the moment the
    broker appended the record.
spec:
  partitions: 6
  replicationFactor: 3
  retentionMinutes: 60
  placement:
    strategy: any
  settings:
    min.insync.replicas: 2
    unclean.leader.election.enable: false
    message.timestamp.type: LogAppendTime

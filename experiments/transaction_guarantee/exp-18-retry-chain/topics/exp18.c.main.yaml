meta:
  name: exp18.c.main
  cluster: kafka-lab
  region: local
  environment: lab
  description: |
    exp-18, cell C, the retry chain, with the merchant locked past every tier: the payments
    are archived as exhausted and replayed once the lock is gone.
    Six partitions like payments.main, so the contended payments are spread over the
    partitions the way a hot merchant's payments are.
spec:
  partitions: 6
  replicationFactor: 3
  retentionMinutes: 60
  placement:
    strategy: any
  settings:
    min.insync.replicas: 2
    unclean.leader.election.enable: false

meta:
  name: exp08.all2
  cluster: kafka-lab
  region: local
  environment: lab
  description: |
    exp-08, third cell: the acks=1 cell's failure with acks=all instead — the followers
    paused, the leader killed, the followers thawed. min.insync.replicas 2 as in the
    catalog, so the only difference from exp08.acks1 is what the producer asks for.

spec:
  partitions: 1
  replicationFactor: 3
  retentionMinutes: 60
  placement:
    strategy: any
  settings:
    min.insync.replicas: 2
    unclean.leader.election.enable: false
